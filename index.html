    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f3f4f6; }
    th { background: #f9fafb; font-weight: 600; color: #374151; }
    tr:hover { background: #f9fafb; }
    .warning-high { color: #dc2626; font-weight: 600; }
    .warning-medium { color: #ea580c; font-weight: 600; }
    .warning-low { color: #ca8a04; font-weight: 600; }
    .canvas-container { width: 100%; height: 300px; }
    .growth-up { color: #10b981; font-weight: 600; }

                  <td>${formatCurrency(item.unitPrice)}</td>
                  <td>${formatCurrency(item.revenue)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderPurchase() {
      return `
        <div class="content">
          <h2>购进管理</h2>
          <table>
            <thead>
              <tr><th>商品名称</th><th>分类</th><th>规格</th><th>购进量</th><th>购进额</th><th>供应商</th></tr>
            </thead>
            <tbody>
              ${store.purchase.map(item => `
                <tr>
                  <td>${item.productName}</td>
                  <td>${item.category}</td>
                  <td>${item.spec}</td>
                  <td>${formatNumber(item.quantity)}</td>
                  <td>${formatCurrency(item.amount)}</td>
                  <td>${item.supplier}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderInventory() {
      return `
        <div class="content">
          <h2>库存管理</h2>
          <table>
            <thead>
              <tr><th>物料编码</th><th>物料名称</th><th>规格</th><th>仓库</th><th>库存量</th><th>预警等级</th></tr>
            </thead>
            <tbody>
              ${store.inventory.map(item => `
                <tr>
                  <td>${item.materialCode}</td>
                  <td>${item.materialName}</td>
                  <td>${item.spec}</td>
                  <td>${item.warehouse}</td>
                  <td>${formatNumber(item.quantity)} ${item.unit}</td>
                  <td>${item.warningLevel ? '<span class="warning-' + item.warningLevel + '">' + (item.warningLevel === 'high' ? '高' : item.warningLevel === 'medium' ? '中' : '低') + '</span>' : '<span style="color: #16a34a;">正常</span>'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function drawLineChart() {
      const ctx = document.getElementById('lineChart');
      if (!ctx) return;
      const canvas = ctx;
      const c = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const padding = { top: 30, right: 30, bottom: 40, left: 60 };
      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom;
      const data = store.monthlyStats;
      const maxValue = Math.max(...data.map(d => Math.max(d.sales, d.purchase))) * 1.1;

      c.clearRect(0, 0, width, height);
      c.strokeStyle = '#e5e7eb';
      for (let i = 0; i <= 4; i++) {
        const y = padding.top + (chartHeight / 4) * i;
        c.beginPath();
        c.moveTo(padding.left, y);
        c.lineTo(width - padding.right, y);
        c.stroke();
        c.fillStyle = '#6b7280';
        c.font = '12px sans-serif';
        c.textAlign = 'right';
        c.fillText((Math.round(maxValue - (maxValue / 4) * i) / 10000).toFixed(0) + '万', padding.left - 5, y + 4);
      }

      const datasets = [
        { data: data.map(d => d.sales), color: '#3b82f6', label: '销售额' },
        { data: data.map(d => d.purchase), color: '#10b981', label: '购进额' },
      ];

      datasets.forEach(ds => {
        c.beginPath();
        c.strokeStyle = ds.color;
        c.lineWidth = 2;
        ds.data.forEach((value, i) => {
          const x = padding.left + (chartWidth / (data.length - 1)) * i;
          const y = padding.top + chartHeight - (value / maxValue) * chartHeight;
          if (i === 0) c.moveTo(x, y);
          else c.lineTo(x, y);
        });
        c.stroke();
        c.fillStyle = ds.color;
        ds.data.forEach((value, i) => {
          const x = padding.left + (chartWidth / (data.length - 1)) * i;
          const y = padding.top + chartHeight - (value / maxValue) * chartHeight;
          c.beginPath();
          c.arc(x, y, 4, 0, Math.PI * 2);
          c.fill();
        });
      });

      c.fillStyle = '#6b7280';
      c.font = '11px sans-serif';
      c.textAlign = 'center';
      data.forEach((d, i) => {
        const x = padding.left + (chartWidth / (data.length - 1)) * i;
        c.fillText(d.month.substring(5), x, height - 10);
      });

      datasets.forEach((ds, i) => {
        const x = padding.left + 10 + i * 100;
        const y = padding.top + 20;
        c.fillStyle = ds.color;
        c.fillRect(x, y - 5, 12, 2);
        c.fillStyle = '#6b7280';
        c.textAlign = 'left';
        c.fillText(ds.label, x + 16, y);
      });
    }

    function drawPieChart() {
      const ctx = document.getElementById('pieChart');
      if (!ctx) return;
      const canvas = ctx;
      const c = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const centerX = width / 2;
      const centerY = height / 2;
      const radius = Math.min(width, height) / 2 - 40;
      const data = store.categorySales;
      const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16', '#f97316', '#6366f1', '#14b8a6', '#a855f7'];
      const total = data.reduce((sum, d) => sum + d.revenue, 0);

      c.clearRect(0, 0, width, height);
      let startAngle = -Math.PI / 2;
      data.forEach((d, i) => {
        const sliceAngle = (d.revenue / total) * Math.PI * 2;
        const endAngle = startAngle + sliceAngle;
        c.beginPath();
        c.moveTo(centerX, centerY);
        c.arc(centerX, centerY, radius, startAngle, endAngle);
        c.closePath();
        c.fillStyle = colors[i % colors.length];
        c.fill();
        startAngle = endAngle;
      });

      c.fillStyle = '#ffffff';
      c.beginPath();
      c.arc(centerX, centerY, radius * 0.6, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#1f2937';
      c.font = 'bold 14px sans-serif';
      c.textAlign = 'center';
      c.fillText(formatCurrency(total), centerX, centerY);

      let legendY = centerY + radius + 10;
      data.forEach((d, i) => {
        const x = centerX - 60 + (i % 2) * 120;
        const y = legendY + Math.floor(i / 2) * 18;
        c.fillStyle = colors[i % colors.length];
        c.fillRect(x, y - 5, 10, 10);
        c.fillStyle = '#6b7280';
        c.font = '11px sans-serif';
        c.textAlign = 'left';
        c.fillText(d.category, x + 14, y + 3);
      });
    }

    function drawWarehouseChart() {
      const ctx = document.getElementById('warehouseChart');
      if (!ctx) return;
      const canvas = ctx;
      const c = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const centerX = width / 2;
      const centerY = height / 2;
      const radius = Math.min(width, height) / 2 - 40;
      const data = store.warehouseDistribution;
      const colors = ['#3b82f6', '#10b981', '#f59e0b'];
      const total = data.reduce((sum, d) => sum + d.quantity, 0);

      c.clearRect(0, 0, width, height);
      let startAngle = -Math.PI / 2;
      data.forEach((d, i) => {
        const sliceAngle = (d.quantity / total) * Math.PI * 2;
        const endAngle = startAngle + sliceAngle;
        c.beginPath();
        c.moveTo(centerX, centerY);
        c.arc(centerX, centerY, radius, startAngle, endAngle);
        c.closePath();
        c.fillStyle = colors[i % colors.length];
        c.fill();
        startAngle = endAngle;
      });

      c.fillStyle = '#ffffff';
      c.beginPath();
      c.arc(centerX, centerY, radius * 0.6, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#1f2937';
      c.font = 'bold 14px sans-serif';
      c.textAlign = 'center';
      c.fillText(total.toFixed(2) + ' 吨', centerX, centerY);

      let legendY = centerY + radius + 10;
      data.forEach((d, i) => {
        const x = centerX - 70;
        const y = legendY + i * 18;
        c.fillStyle = colors[i % colors.length];
        c.fillRect(x, y - 5, 10, 10);
        c.fillStyle = '#6b7280';
        c.font = '11px sans-serif';
        c.textAlign = 'left';
        c.fillText(d.warehouse + ' (' + d.percentage + '%)', x + 14, y + 3);
      });
    }

    function renderApp(tab = 'dashboard') {
      const app = document.getElementById('app');
      app.innerHTML = `
        ${renderHeader()}
        ${renderNav(tab)}
        ${tab === 'dashboard' ? renderDashboard() : ''}
        ${tab === 'sales' ? renderSales() : ''}
        ${tab === 'purchase' ? renderPurchase() : ''}
        ${tab === 'inventory' ? renderInventory() : ''}
      `;
      if (tab === 'dashboard') {
        setTimeout(() => {
          drawLineChart();
          drawPieChart();
          drawWarehouseChart();
        }, 100);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderApp('dashboard');
    });
  </script>
</body>
</html>
