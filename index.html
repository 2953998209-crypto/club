    function render(vnode, container) {
      if (typeof vnode === 'string' || typeof vnode === 'number') {
        container.appendChild(document.createTextNode(vnode));
        return;
      }
      if (!vnode) return;
      const element = typeof vnode.type === 'function' 
        ? renderComponent(vnode.type, vnode.props, vnode.children)
        : document.createElement(vnode.type);
      if (vnode.props) {
        for (const [key, value] of Object.entries(vnode.props)) {
          if (key === 'className') element.className = value;
          else if (key === 'style') Object.assign(element.style, value);
          else if (key.startsWith('on') && typeof value === 'function') {
            element.addEventListener(key.toLowerCase().slice(2), value);
          } else if (key === 'checked' || key === 'disabled' || key === 'selected') {
            element[key] = value;
          } else {
            element.setAttribute(key, value);
          }
        }
      }
      vnode.children.forEach(child => render(child, element));
      container.appendChild(element);
    }

    function renderComponent(Component, props, children) {
      const instance = new Component();
      const state = {};
      const setState = (newState) => {
        Object.assign(state, newState);
        instance.forceUpdate();
      };
      instance.props = props;
      instance.children = children;
      instance.state = state;
      instance.setState = setState;
      instance.forceUpdate = () => {
        const container = document.createElement('div');
        const vnode = instance.render();
        render(vnode, container);
        return container.firstChild;
      };
      return instance.forceUpdate();
    }

      subscribe(listener) {

        return () => this.listeners = this.listeners.filter(l => l !== listener);

        this.listeners.forEach(l => l(this.currentPath));
      }

        return this.routes.find(r => r.path === this.currentPath);
      }

        AlertCircle: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>',
      };
      return icons[name] || icons.BarChart3;
    }

    function Icon({ name, className }) {
      return h('span', { className, dangerouslySetInnerHTML: createIcon(name) });
    }

    function KPICard({ title, value, growth, icon, color, prefix = '' }) {
      const colorClasses = {
        blue: 'bg-blue-500',
        green: 'bg-green-500',
        orange: 'bg-orange-500',
        purple: 'bg-purple-500',
        red: 'bg-red-500',
      };
      return h('div', { className: 'bg-white rounded-xl p-6 shadow-sm border border-gray-100 hover:shadow-md transition-all' },
        h('div', { className: 'flex items-center justify-between' },
          h('div', null,
            h('p', { className: 'text-gray-500 text-sm font-medium' }, title),
            h('p', { className: 'text-2xl font-bold text-gray-800 mt-2' }, prefix + (typeof value === 'number' ? value.toLocaleString() : value)),
            growth !== undefined && h('p', { className: 'text-sm mt-1 flex items-center gap-1 ' + (growth >= 0 ? 'text-green-600' : 'text-red-600') },
              h('span', { className: 'w-4 h-4 inline-block', dangerouslySetInnerHTML: createIcon(growth >= 0 ? 'TrendingUp' : 'TrendingDown') }),
              Math.abs(growth) + '%'
            )
          ),
          h('div', { className: `w-14 h-14 ${colorClasses[color]} rounded-xl flex items-center justify-center text-white` },
            h('span', { className: 'w-6 h-6', dangerouslySetInnerHTML: createIcon(icon) })
          )
        )
      );
    }

    function SimpleLineChart({ data, title }) {
      return h('div', { className: 'bg-white rounded-xl p-6 shadow-sm border border-gray-100' },
        h('h3', { className: 'text-lg font-semibold text-gray-800 mb-4' }, title),
        h('canvas', { id: `line-${title}` })
      );

    function SimplePieChart({ data, title }) {
      return h('div', { className: 'bg-white rounded-xl p-6 shadow-sm border border-gray-100' },
        h('h3', { className: 'text-lg font-semibold text-gray-800 mb-4' }, title),
        h('canvas', { id: `pie-${title}` })

    }

    function SimpleBarChart({ data, title }) {
      return h('div', { className: 'bg-white rounded-xl p-6 shadow-sm border border-gray-100' },
        h('h3', { className: 'text-lg font-semibold text-gray-800 mb-4' }, title),

    }

    function DataTable({ columns, data, title }) {
      return h('div', { className: 'bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden' },
        title && h('div', { className: 'p-4 border-b border-gray-100' },

    class UploadPage {
      constructor() {
        this.state = { uploadType: 'inventory', message: null };
      }
      handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const csv = event.target.result;
            const lines = csv.split('\n').filter(line => line.trim());
            const headers = lines[0].split(',').map(h => h.trim());
            const data = lines.slice(1).map(line => {
              const values = line.split(',');
              return headers.reduce((acc, header, idx) => { acc[header] = values[idx]?.trim(); return acc; }, {});
            });
            switch (this.state.uploadType) {
              case 'inventory':
                store.setInventory(data.map((item, idx) => ({
                  id: 'upload-' + Date.now() + '-' + idx,
                  materialCode: item['物料编码'] || item['materialCode'] || '',
                  materialName: item['物料名称'] || item['materialName'] || item['productName'] || '',
                  spec: item['规格'] || item['spec'] || '',
                  warehouse: item['仓库'] || item['warehouse'] || '',
                  quantity: Number(item['结存主数量'] || item['quantity'] || 0),
                  unit: item['单位'] || item['unit'] || '袋',
                })));
                break;
              case 'sales':
                store.setSales(data.map((item, idx) => ({
                  id: 'upload-' + Date.now() + '-' + idx,
                  category: item['物料分类'] || item['category'] || '',
                  productName: item['商品名称'] || item['productName'] || '',
                  spec: item['规格'] || item['spec'] || '',
                  quantity: Number(item['销量'] || item['quantity'] || 0),
                  revenue: Number(item['销售收入'] || item['revenue'] || 0),
                  unitPrice: Number(item['单价'] || item['unitPrice'] || 0),
                  date: item['日期'] || new Date().toISOString().slice(0, 7),
                })));
                break;
              case 'purchase':
                store.setPurchase(data.map((item, idx) => ({
                  id: 'upload-' + Date.now() + '-' + idx,
                  category: item['物料分类'] || item['category'] || '',
                  productName: item['商品名称'] || item['productName'] || '',
                  spec: item['规格'] || item['spec'] || '',
                  quantity: Number(item['购进量'] || item['quantity'] || 0),
                  amount: Number(item['购进额'] || item['amount'] || 0),
                  supplier: item['供应商'] || item['supplier'] || '',
                  date: item['日期'] || new Date().toISOString().slice(0, 7),
                })));
                break;
            }
            this.setState({ message: { type: 'success', text: '成功上传 ' + data.length + ' 条数据！' } });
            setTimeout(() => this.setState({ message: null }), 3000);
          } catch (error) {
            this.setState({ message: { type: 'error', text: '数据解析失败，请检查文件格式！' } });
            setTimeout(() => this.setState({ message: null }), 3000);
          }
        };
        reader.readAsText(file);
      }
      render() {
        return h(Layout, { title: '数据上传' },
          h('div', { className: 'space-y-6' },
            this.state.message && h('div', { className: 'flex items-center gap-3 p-4 rounded-lg ' + (this.state.message.type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700') },
              h('span', { className: 'w-5 h-5', dangerouslySetInnerHTML: createIcon(this.state.message.type === 'success' ? 'CheckCircle' : 'AlertCircle') }),
              h('span', null, this.state.message.text)
            ),
            h('div', { className: 'flex items-center gap-4 bg-white rounded-xl p-4 shadow-sm border border-gray-100' },
              h('span', { className: 'text-sm text-gray-600' }, '上传类型：'),
              h('div', { className: 'flex gap-2' },
                h('button', { onClick: () => this.setState({ uploadType: 'inventory' }), className: 'px-4 py-2 rounded-lg text-sm font-medium transition-colors ' + (this.state.uploadType === 'inventory' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600') }, '库存数据'),
                h('button', { onClick: () => this.setState({ uploadType: 'sales' }), className: 'px-4 py-2 rounded-lg text-sm font-medium transition-colors ' + (this.state.uploadType === 'sales' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600') }, '销售数据'),
                h('button', { onClick: () => this.setState({ uploadType: 'purchase' }), className: 'px-4 py-2 rounded-lg text-sm font-medium transition-colors ' + (this.state.uploadType === 'purchase' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600') }, '购进数据')
              )
            ),
            h('div', { className: 'bg-white rounded-xl p-6 shadow-sm border border-gray-100' },
              h('div', { className: 'border-2 border-dashed border-gray-300 rounded-xl p-12 text-center hover:border-blue-500 transition-colors' },
                h('span', { className: 'w-12 h-12 text-gray-400 mx-auto mb-4', dangerouslySetInnerHTML: createIcon('Upload') }),
                h('p', { className: 'text-gray-600 mb-2' }, '拖拽CSV文件到此处，或点击选择文件'),
                h('p', { className: 'text-sm text-gray-400' }, '支持 .csv 格式文件'),
                h('input', { type: 'file', accept: '.csv', onChange: e => this.handleFileUpload(e), className: 'mt-4 w-full h-10 opacity-0 absolute' }),
                h('button', { onClick: () => document.querySelector('input[type="file"]').click() }, { className: 'mt-4 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors' }, '选择文件')
              )
            )
          )
        );
      }
    }

    function renderLineChart(title, data) {
      const ctx = document.getElementById('line-' + title);
      if (!ctx) return;
      const canvas = ctx;
      const ctx2 = canvas.getContext('2d');
      const width = canvas.offsetWidth;
      const height = canvas.offsetHeight || 300;
      canvas.width = width;
      canvas.height = height;
      const padding = { top: 30, right: 30, bottom: 40, left: 50 };
      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom;
      const maxValue = Math.max(...data.map(d => Math.max(d.sales, d.purchase, d.inventory))) * 1.1;
      ctx2.clearRect(0, 0, width, height);
      ctx2.strokeStyle = '#e5e7eb';
      ctx2.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = padding.top + (chartHeight / 4) * i;
        ctx2.beginPath();
        ctx2.moveTo(padding.left, y);
        ctx2.lineTo(width - padding.right, y);
        ctx2.stroke();
        ctx2.fillStyle = '#6b7280';
        ctx2.font = '12px sans-serif';
        ctx2.textAlign = 'right';
        ctx2.fillText(Math.round(maxValue - (maxValue / 4) * i).toLocaleString(), padding.left - 5, y + 4);
      }
      ctx2.fillStyle = '#6b7280';
      ctx2.font = '12px sans-serif';
      ctx2.textAlign = 'center';
      data.forEach((d, i) => {
        const x = padding.left + (chartWidth / (data.length - 1)) * i;
        ctx2.fillText(d.month, x, height - 10);
      });
      const datasets = [
        { data: data.map(d => d.sales), color: '#3b82f6', label: '销售额' },
        { data: data.map(d => d.purchase), color: '#10b981', label: '购进额' },
        { data: data.map(d => d.inventory), color: '#f59e0b', label: '库存量' },
      ];
      datasets.forEach(ds => {
        ctx2.beginPath();
        ctx2.strokeStyle = ds.color;
        ctx2.lineWidth = 2;
        ctx2.lineCap = 'round';
        ctx2.lineJoin = 'round';
        ds.data.forEach((value, i) => {
          const x = padding.left + (chartWidth / (data.length - 1)) * i;
          const y = padding.top + chartHeight - (value / maxValue) * chartHeight;
          if (i === 0) ctx2.moveTo(x, y);
          else ctx2.lineTo(x, y);
        });
        ctx2.stroke();
        ctx2.fillStyle = ds.color;
        ds.data.forEach((value, i) => {
          const x = padding.left + (chartWidth / (data.length - 1)) * i;
          const y = padding.top + chartHeight - (value / maxValue) * chartHeight;
          ctx2.beginPath();
          ctx2.arc(x, y, 4, 0, Math.PI * 2);
          ctx2.fill();
        });
      });
      ctx2.fillStyle = '#6b7280';
      ctx2.font = '12px sans-serif';
      ctx2.textAlign = 'left';
      datasets.forEach((ds, i) => {
        const x = padding.left + 10 + i * 100;
        const y = padding.top + 20;
        ctx2.fillStyle = ds.color;
        ctx2.fillRect(x, y - 5, 12, 2);
        ctx2.fillStyle = '#6b7280';
        ctx2.fillText(ds.label, x + 16, y);
      });
    }

    function renderPieChart(title, data) {
      const ctx = document.getElementById('pie-' + title);
      if (!ctx) return;
      const canvas = ctx;
      const ctx2 = canvas.getContext('2d');
      const width = canvas.offsetWidth;
      const height = canvas.offsetHeight || 300;
      canvas.width = width;
      canvas.height = height;
      const centerX = width / 2;
      const centerY = height / 2;
      const radius = Math.min(width, height) / 2 - 40;
      ctx2.clearRect(0, 0, width, height);
      const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];
      const total = data.reduce((sum, d) => sum + (d.revenue || d.quantity), 0);
      let startAngle = -Math.PI / 2;
      data.forEach((d, i) => {
        const value = d.revenue || d.quantity;
        const sliceAngle = (value / total) * Math.PI * 2;
        const endAngle = startAngle + sliceAngle;
        ctx2.beginPath();
        ctx2.moveTo(centerX, centerY);
        ctx2.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx2.closePath();
        ctx2.fillStyle = colors[i % colors.length];
        ctx2.fill();
        startAngle = endAngle;
      });
      ctx2.fillStyle = '#ffffff';
      ctx2.beginPath();
      ctx2.arc(centerX, centerY, radius * 0.6, 0, Math.PI * 2);
      ctx2.fill();
      ctx2.fillStyle = '#1f2937';
      ctx2.font = 'bold 20px sans-serif';
      ctx2.textAlign = 'center';
      ctx2.fillText(total.toLocaleString(), centerX, centerY);
      ctx2.font = '12px sans-serif';
      ctx2.fillStyle = '#6b7280';
      ctx2.fillText('总数', centerX, centerY + 20);
      let legendY = centerY + radius + 20;
      data.forEach((d, i) => {
        const x = centerX - 80 + (i % 2) * 160;
        const y = legendY + Math.floor(i / 2) * 20;
        ctx2.fillStyle = colors[i % colors.length];
        ctx2.fillRect(x, y - 5, 12, 12);
        ctx2.fillStyle = '#6b7280';
        ctx2.font = '12px sans-serif';
        ctx2.textAlign = 'left';
        ctx2.fillText(d.category || d.warehouse || d.level, x + 16, y + 4);
      });
    }

    function renderBarChart(title, data) {
      const ctx = document.getElementById('bar-' + title);
      if (!ctx) return;
      const canvas = ctx;
      const ctx2 = canvas.getContext('2d');
      const width = canvas.offsetWidth;
      const height = canvas.offsetHeight || 300;
      canvas.width = width;
      canvas.height = height;
      const padding = { top: 30, right: 30, bottom: 60, left: 50 };
      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom;
      const displayData = data.slice(0, 10);
      const maxValue = Math.max(...displayData.map(d => d.revenue || d.quantity)) * 1.1;
      ctx2.clearRect(0, 0, width, height);
      ctx2.strokeStyle = '#e5e7eb';
      ctx2.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = padding.top + (chartHeight / 4) * i;
        ctx2.beginPath();
        ctx2.moveTo(padding.left, y);
        ctx2.lineTo(width - padding.right, y);
        ctx2.stroke();
        ctx2.fillStyle = '#6b7280';
        ctx2.font = '12px sans-serif';
        ctx2.textAlign = 'right';
        ctx2.fillText(Math.round(maxValue - (maxValue / 4) * i).toLocaleString(), padding.left - 5, y + 4);
      }
      const barWidth = chartWidth / displayData.length * 0.6;
      const gap = chartWidth / displayData.length * 0.4;
      const colors = ['#3b82f6', '#60a5fa', '#93c5fd', '#bfdbfe', '#dbeafe', '#3b82f6', '#60a5fa', '#93c5fd', '#bfdbfe', '#dbeafe'];
      displayData.forEach((d, i) => {
        const x = padding.left + (chartWidth / displayData.length) * i + gap / 2;
        const value = d.revenue || d.quantity;
        const barHeight = (value / maxValue) * chartHeight;
        ctx2.fillStyle = colors[i];
        ctx2.fillRect(x, padding.top + chartHeight - barHeight, barWidth, barHeight);
        ctx2.fillStyle = '#6b7280';
        ctx2.font = '10px sans-serif';
        ctx2.textAlign = 'center';
        const label = (d.productName || d.category || d.warehouse);
        ctx2.fillText(label.length > 8 ? label.slice(0, 8) + '...' : label, x + barWidth / 2, height - 10);
      });
    }

    function init() {
      const root = document.getElementById('root');
      root.innerHTML = '';
      const currentRoute = router.getCurrentRoute();
      if (currentRoute) {
        const vnode = h(currentRoute.component);
        render(vnode, root);
      }
      router.subscribe(() => {
        root.innerHTML = '';
        const route = router.getCurrentRoute();
        if (route) {
          const vnode = h(route.component);
          render(vnode, root);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', init);
